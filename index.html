<!DOCTYPE html>
<html lang="ka" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Noto+Sans+Georgian:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: practical, encouraging, like a good first manager.
   IDEA: a shift timecard. Every task is a ticket you punch in on, every finished one is proof.
   PICTURE: the live shift ticket on home, the student's profile as the main showcase.
   COLOUR and TYPE: white and ink, hi-vis yellow ticket, work-blue accents. Archivo + Noto Sans Georgian.
   LAYOUT: top bar with language and theme toggles, one view per route, stacks on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121417);--ink:light-dark(#15171c,#eef0f3);--soft:light-dark(#5b606b,#a3a9b4);
--line:light-dark(#e2e4e8,#2a2e35);--card:light-dark(#f5f6f8,#1b1e23);
--hi:#ffd23f;--hiink:#15171c;--blue:light-dark(#2448e0,#7f9bff);--ok:light-dark(#11804a,#4fd08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Archivo,"Noto Sans Georgian",system-ui,sans-serif;overflow-x:clip}
a{color:var(--blue)}
h1,h2,h3{line-height:1.15;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,50px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(23px,3vw,31px);font-weight:800}
h3{font-size:19px;font-weight:600}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(28px,4vw,56px) 0}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-height:64px;padding-block:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;margin-inline-end:auto}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:10px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
nav a.on{background:var(--card)}
.tools{display:flex;gap:6px;align-items:center}
.tg{font:600 14px Archivo,"Noto Sans Georgian",sans-serif;min-height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:99px}
.btn{font:600 16px Archivo,"Noto Sans Georgian",sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.ghost{background:transparent;color:var(--ink)}
.hib{background:var(--hi);color:var(--hiink);border-color:var(--hiink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--soft)}.small{font-size:14px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.av.s{width:32px;height:32px;font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.lead{font-size:18px;max-width:36em}
.ticket{position:relative;background:var(--hi);color:var(--hiink);border-radius:16px;padding:26px 26px 22px 58px;box-shadow:0 18px 0 -8px light-dark(#e8b900,#8a6d00),0 30px 50px -20px #0005;transform:rotate(-1.2deg)}
.ticket::before{content:"";position:absolute;left:20px;top:24px;bottom:24px;width:14px;background:radial-gradient(circle,var(--bg) 6px,transparent 7px) 0 0/14px 26px repeat-y}
.ticket .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.ticket h3{font-size:23px;font-weight:800;margin:14px 0 8px}
.clock{font-size:clamp(40px,6vw,58px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ticket ul{margin:12px 0 16px;padding-left:20px}
.ticket .btn{border-color:var(--hiink);background:var(--hiink);color:var(--hi)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{border-top:3px solid var(--ink);padding-top:14px}
.step b{display:block;font-size:19px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:2px 0}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;flex-wrap:wrap}
.done{color:var(--ok);font-weight:600;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.filters button{font:500 15px Archivo,"Noto Sans Georgian",sans-serif;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.brief{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.from{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.box{width:22px;height:22px;flex:none;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:800}
.box.y{background:var(--blue);border-color:var(--blue);color:#fff}
.side{position:sticky;top:84px}
.score{font-size:64px;font-weight:800;line-height:1}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.meter i{display:block;height:100%;background:var(--blue)}
.entry{border:1px solid var(--line);border-radius:14px;padding:18px}
.entry .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q{display:block;margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--hi);background:var(--card);border-radius:0 8px 8px 0;font-size:15px}
.pro{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:26px;border-radius:18px;background:var(--ink);color:var(--bg)}
.pro .big{width:96px;height:96px;font-size:38px;background:var(--hi);color:var(--hiink)}
.pro h1{margin:0 0 4px}
.pro .chip{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.pro .open{background:var(--hi);color:var(--hiink);border-color:var(--hi)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0 8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat em{font-style:normal;color:var(--ok);font-size:13px;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:30px}
.sec{margin-bottom:34px}
.sec>h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 span{font-size:15px;font-weight:500;color:var(--soft)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:10px 0 0;border-bottom:1.5px solid var(--ink)}
.chart div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.chart div.z{background:var(--line)}
.chart div.now{background:var(--hi);outline:1.5px solid var(--hiink)}
.chart span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:600}
.cax{display:flex;gap:6px;font-size:12px;color:var(--soft);margin-top:4px}.cax span{flex:1;text-align:center;white-space:nowrap}
.skill{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 3em;gap:10px;align-items:center;margin-bottom:10px;font-size:15px}
.skill .meter{margin:0}.skill b{text-align:right;font-variant-numeric:tabular-nums}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cert{position:relative;border:2px solid var(--ink);border-radius:12px;padding:18px 18px 16px;background:var(--bg);overflow:hidden}
.cert::after{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:8px;pointer-events:none}
.cert .seal{float:right;margin:-4px -4px 6px 10px}
.cert h3{font-size:18px;font-weight:800;margin:4px 0}
.cert .id{font-size:12px;color:var(--soft);margin-top:10px;font-variant-numeric:tabular-nums}
.cert.wip{border-style:dashed;border-color:var(--soft)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.badge svg{flex:none}
.list{display:grid;gap:12px}
.feed{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.feed:last-child{border:0}
footer{border-top:1px solid var(--line);margin-top:40px}
@media(max-width:960px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.cols,.two,.hero{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media(max-width:600px){.steps{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ticket{padding-left:50px;transform:none}.ticket::before{left:16px}nav a{padding:10px 7px}.pro{grid-template-columns:minmax(0,1fr)}.me span{display:none}.chart span{display:none}}
@media(prefers-reduced-motion:no-preference){.ticket{transition:transform .3s}.ticket:hover{transform:rotate(0)}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#home"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="3" width="24" height="22" rx="4" fill="#ffd23f" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="9" r="2" fill="currentColor"/><circle cx="8" cy="15" r="2" fill="currentColor"/><circle cx="8" cy="21" r="2" fill="currentColor"/><path d="M13 10h8M13 15h8M13 20h5" stroke="currentColor" stroke-width="2"/></svg>EduTech</a>
  <nav id="nav"></nav>
  <div class="tools"><button class="tg" id="lang" type="button"></button><button class="tg" id="theme" type="button"></button><a class="me" href="#profile" id="me"></a></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap band small muted" id="foot"></div></footer>

<script>
{
let lang="ka",theme="light";
try{lang=localStorage.getItem("et-lang")||"ka";theme=localStorage.getItem("et-theme")||"light"}catch(e){}
const tr=s=>{const p=String(s).split("|");return lang==="ka"&&p[1]!==undefined?p[1]:p[0]};
const L=(en,ka)=>lang==="ka"?ka:en;

const FIELDS=["Web development|ვებ დეველოპმენტი","Design|დიზაინი","Marketing|მარკეტინგი","Data|მონაცემები","Writing|წერა","Customer support|მომხმარებელთა მხარდაჭერა","Finance|ფინანსები","Engineering|ინჟინერია"];
const F=i=>FIELDS[i];
const BEG="Beginner|დამწყები",MID="Intermediate|საშუალო";
const CO={rioni:"Rioni Coffee|რიონი ქოფი",bagrati:"Bagrati Books|ბაგრატი ბუქსი",satsuri:"Satsuri Shoes|სატსური შუზი",lingua:"LinguaLeap|ლინგვალიპი",youth:"Kutaisi Youth Center|ქუთაისის ახალგაზრდული ცენტრი",agro:"Imereti Agro|იმერეთი აგრო"};
const TASKS=[
{id:"web-signup",f:F(0),t:"Fix a broken signup form|შეაკეთე გაფუჭებული რეგისტრაციის ფორმა",co:CO.rioni,who:"Nino, Product lead|ნინო, პროდუქტის მენეჯერი",lvl:BEG,min:45,sk:["HTML","Forms|ფორმები","Debugging|შეცდომების გასწორება"],
b:"Our website signup form lets people submit an empty email and the button does nothing on phones. Customers are complaining. Find what is wrong and explain your fix.|ჩვენი საიტის რეგისტრაციის ფორმა ცარიელი ელფოსტით გაგზავნის საშუალებას იძლევა, ტელეფონზე კი ღილაკი საერთოდ არ მუშაობს. მომხმარებლები უკმაყოფილოები არიან. იპოვე პრობლემა და ახსენი, როგორ გაასწორებ.",
st:["List at least 3 problems you would check for|ჩამოწერე მინიმუმ 3 პრობლემა, რომელსაც შეამოწმებდი","Write the corrected HTML for the form|დაწერე ფორმის გასწორებული HTML","Add validation so empty or wrong emails are blocked|დაამატე ვალიდაცია, რომ ცარიელი ან არასწორი ელფოსტა დაიბლოკოს","Explain how you would test it on a phone|ახსენი, როგორ შეამოწმებდი ტელეფონზე"]},
{id:"web-pricing",f:F(0),t:"Build a pricing card|ააწყვე ფასების ბლოკი",co:CO.bagrati,who:"Giorgi, Frontend dev|გიორგი, ფრონტენდ დეველოპერი",lvl:BEG,min:60,sk:["HTML","CSS","Responsive|ადაპტიური"],
b:"We are launching a book subscription with 3 plans. Build the pricing section so it looks good on desktop and stacks on mobile.|ვიწყებთ წიგნების გამოწერას 3 პაკეტით. ააწყვე ფასების სექცია, რომ კომპიუტერზე კარგად გამოიყურებოდეს და ტელეფონზე ერთმანეთის ქვეშ ჩალაგდეს.",
st:["Three plans: Reader 9 GEL, Bookworm 19 GEL, Library 29 GEL|სამი პაკეტი: მკითხველი 9 ლარი, წიგნის ჭია 19 ლარი, ბიბლიოთეკა 29 ლარი","Highlight the middle plan as most popular|შუა პაკეტი გამოყავი, როგორც ყველაზე პოპულარული","Make it stack on screens under 600px|600px-ზე ვიწრო ეკრანზე ერთმანეთის ქვეშ ჩალაგდეს","Share your code or a CodePen link|გააზიარე კოდი ან CodePen-ის ბმული"]},
{id:"web-speed",f:F(0),t:"Make a slow page faster|ნელი გვერდი გახადე სწრაფი",co:CO.satsuri,who:"Giorgi, Frontend dev|გიორგი, ფრონტენდ დეველოპერი",lvl:MID,min:60,sk:["Performance|სისწრაფე","Images|სურათები","Debugging|შეცდომების გასწორება"],
b:"Our shoe catalogue takes 9 seconds to load on mobile data. Find the three biggest problems and fix them.|ჩვენი ფეხსაცმლის კატალოგი მობილურ ინტერნეტზე 9 წამი იტვირთება. იპოვე სამი ყველაზე დიდი პრობლემა და გაასწორე.",
st:["Run a speed test and note the score|გაუშვი სისწრაფის ტესტი და ჩაიწერე ქულა","Find the 3 biggest problems|იპოვე 3 ყველაზე დიდი პრობლემა","Fix images and loading order|გაასწორე სურათები და ჩატვირთვის რიგი","Report the new score|აცნობე ახალი ქულა"]},
{id:"des-menu",f:F(1),t:"Redesign a café menu for phones|გადააკეთე კაფის მენიუ ტელეფონისთვის",co:CO.rioni,who:"Ana, Owner|ანა, მფლობელი",lvl:BEG,min:60,sk:["UI design|UI დიზაინი","Typography|ტიპოგრაფია","Figma"],
b:"Our paper menu was scanned as a photo and it is unreadable on phones. Design a simple mobile menu page for our QR code.|ჩვენი ქაღალდის მენიუ ფოტოდ არის დასკანერებული და ტელეფონზე არ იკითხება. შექმენი მარტივი მობილური მენიუ ჩვენი QR კოდისთვის.",
st:["Group items into coffee, tea, food|დაყავი ყავად, ჩაიდ და საჭმელად","Pick 2 fonts and 3 colours and say why|აირჩიე 2 შრიფტი და 3 ფერი და ახსენი რატომ","Make prices easy to scan|ფასები ადვილად იკითხებოდეს","Share a Figma or image link|გააზიარე Figma-ს ან სურათის ბმული"]},
{id:"des-posts",f:F(1),t:"Three posts for a book fair|სამი პოსტი წიგნის ბაზრობისთვის",co:CO.bagrati,who:"Luka, Marketing|ლუკა, მარკეტინგი",lvl:MID,min:75,sk:["Social media|სოციალური მედია","Branding|ბრენდინგი","Layout|კომპოზიცია"],
b:"Kutaisi Book Fair is in two weeks. We need three Instagram posts: announcement, guest author, last-day reminder.|ქუთაისის წიგნის ბაზრობა ორ კვირაშია. გვჭირდება სამი Instagram პოსტი: ანონსი, სტუმარი ავტორი და ბოლო დღის შეხსენება.",
st:["Keep one visual style across all three|სამივეს ჰქონდეს ერთი ვიზუალური სტილი","Each post has one clear message|თითო პოსტს ჰქონდეს ერთი მკაფიო გზავნილი","Include date and place|მიუთითე თარიღი და ადგილი","Share links to your designs|გააზიარე დიზაინების ბმულები"]},

<div class="sec"><h2>${L("Activity","აქტივობა")} <span>${L("shifts per week","ცვლა კვირაში")}</span></h2><div class="chart">${ME.weeks.map((w,i)=>`<div class="${w?"":"z"} ${i===ME.weeks.length-1?"now":""}" style="height:${w?w/mx*100:2}%">${w?`<span>${w}</span>`:""}</div>`).join("")}</div>
<div class="cax">${ME.wlab.map(l=>`<span>${l?tr(l):""}</span>`).join("")}</div></div>
<div class="sec"><h2>${L("Skills","უნარები")} <span>${L("from scored work","შეფასებული ნამუშევრიდან")}</span></h2>${ME.skills.map(s=>`<div class="skill"><span>${tr(s[0])}</span><div class="meter"><i style="width:${s[1]}%"></i></div><b>${s[1]}</b></div>`).join("")}</div>
<div class="sec"><h2>${L("Badges","ბეჯები")}</h2><div class="badges">${ME.badges.map(b=>`<div class="badge"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2l11 6v14l-11 6-11-6V8z" fill="${b[1]}"/><circle cx="15" cy="15" r="5" fill="#fff"/></svg>${tr(b[0])}</div>`).join("")}</div></div>
<div class="sec brief"><h3>${L("Employer interest","დამსაქმებლების ინტერესი")}</h3>${ME.views.map(v=>`<div class="feed"><div class="av s">${tr(v[0])[0]}</div><div><b>${tr(v[0])}</b> ${tr(v[1])}<div class="small muted">${tr(v[2])}</div></div></div>`).join("")}</div>
</div></div></div></section>`}

function employers(){return `<section class="band"><div class="wrap"><h1>${L("Hire people who already did the work","დაიქირავე ისინი, ვინც სამუშაო უკვე შეასრულა")}</h1><p class="lead muted">${L("Browse student portfolios by field and skill. You see finished tasks, scores and verified certificates, not just a CV.","დაათვალიერე მოსწავლეების პორტფოლიოები სფეროსა და უნარების მიხედვით. ნახავ დასრულებულ დავალებებს, ქულებს და დადასტურებულ სერტიფიკატებს და არა მხოლოდ CV-ს.")}</p>
${fbtns(filter)}<div class="grid">${CANDS.filter(c=>filter==="All"||c.f.split("|")[0]===filter).map(c=>{const n=tr(c.n);return `<article class="card"><div style="display:flex;gap:10px;align-items:center"><div class="av">${n[0]}</div><div><h3>${n}</h3><div class="small muted">${tr(c.f)}</div></div></div>
<p style="margin:0" class="small">${tr(c.bio)}</p><div class="meta">${c.sk.map(s=>`<span class="chip">${tr(s)}</span>`).join("")}</div>
<div class="foot"><span class="small"><b>${c.done}</b> ${L("shifts · avg","ცვლა · საშ.")} <b>${c.avg}</b></span>${c.me?`<a class="btn" href="#profile">${L("View profile","პროფილის ნახვა")}</a>`:`<span class="chip">${L("Invite","მოწვევა")}</span>`}</div></article>`}).join("")}</div>
<div class="steps" style="margin-top:40px"><div class="step"><b>${L("Post a task","გამოაქვეყნე დავალება")}</b>${L("Write a short brief from your real work. Students try it for free.","დაწერე მოკლე დავალება შენი რეალური სამუშაოდან. მოსწავლეები მას უფასოდ ცდიან.")}</div>
<div class="step"><b>${L("See real output","ნახე რეალური შედეგი")}</b>${L("Compare answers side by side, with time taken and scores.","შეადარე პასუხები ერთმანეთს, დახარჯულ დროსა და ქულებთან ერთად.")}</div>
<div class="step"><b>${L("Invite the best","მოიწვიე საუკეთესოები")}</b>${L("Offer a paid trial or an interview straight from their profile.","შესთავაზე ანაზღაურებადი საცდელი დავალება ან გასაუბრება პირდაპირ პროფილიდან.")}</div></div></div></section>`}

function clock(id){const el=$("#"+id);if(!el)return;let s=754;const f=()=>{el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");s++};f();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(f,1000)}

function chrome(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;
$("#nav").innerHTML=[["home","Home|მთავარი"],["tasks","Tasks|დავალებები"],["profile","Profile|პროფილი"],["employers","For employers|დამსაქმებლებს"]].map(n=>`<a href="#${n[0]}">${tr(n[1])}</a>`).join("");
$("#lang").textContent=lang==="ka"?"EN":"ქარ";$("#lang").setAttribute("aria-label",L("Switch to Georgian","ინგლისურზე გადართვა"));
$("#theme").innerHTML=theme==="light"?moon:sun;$("#theme").setAttribute("aria-label",theme==="light"?L("Dark mode","მუქი რეჟიმი"):L("Light mode","ნათელი რეჟიმი"));
$("#me").innerHTML=`<span class="av s">${tr(ME.init)}</span><span>${tr(ME.sh)}</span>`;
$("#foot").textContent=L("EduTech · TechSpark 2026 prototype · Education theme. The student, companies, scores and certificates shown are sample data for the demo.","EduTech · TechSpark 2026 პროტოტიპი · თემა: განათლება. ნაჩვენები მოსწავლე, კომპანიები, ქულები და სერტიფიკატები სადემონსტრაციო მონაცემებია.")}

function paint(keep){const h=location.hash.slice(1)||"home";chrome();
document.querySelectorAll("#nav a").forEach(a=>{const k=a.hash.slice(1);a.classList.toggle("on",h===k||(k==="tasks"&&h.startsWith("task-")))});
clearInterval(timer);const y=window.scrollY;
app.innerHTML=h==="tasks"?tasks():h.startsWith("task-")?task(h.slice(5)):h==="profile"?profile():h==="employers"?employers():home();
clock("hclock");clock("tclock");window.scrollTo(0,keep?y:0)}

$("#lang").onclick=()=>{lang=lang==="ka"?"en":"ka";try{localStorage.setItem("et-lang",lang)}catch(e){}paint(true)};
$("#theme").onclick=()=>{theme=theme==="light"?"dark":"light";try{localStorage.setItem("et-theme",theme)}catch(e){}chrome()};
app.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;
const h=location.hash.slice(1);if(h==="tasks"||h==="employers")paint(true);else location.hash="tasks"});
window.addEventListener("hashchange",()=>paint());paint();
}
</script>
</body>
</html>
